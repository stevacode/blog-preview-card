<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/styles.css">
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>
<article class="card">
  <div class="card__image">
    <img src="./assets/images/illustration-article.svg" alt="illustration article preview card with dark lines and yellow background">
  </div>
  <div class="card__content">
    <span class="card__category">Learning</span>
    <time datetime="2023-12-21">Published 21 Dec 2023</time>
    <h1 class="card__title">HTML & CSS foundations</h1>
    <p class="card__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    <div class="card__author">
      <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="card__author-image">
      <span class="card__author-name">Greg Hooper</span>
    </div>
  </div>
</article>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/stevacode">stevacode</a>.
  </footer>
</body>
</html>
